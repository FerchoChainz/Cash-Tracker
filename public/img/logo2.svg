<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 160" width="100%" height="100%">
  <defs>
    <!-- Gradiente para el ícono y texto -->
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F3F4F6" />
    </linearGradient>
  </defs>

  <!-- Fondo completamente negro -->
  <rect width="500" height="160" rx="16" fill="#000000" />

  <!-- Ícono: Gráfico de crecimiento abstracto -->
  <g transform="translate(40, 40)">
    <!-- Círculo exterior decorativo -->
    <circle cx="40" cy="40" r="36" fill="none" stroke="#1F2937" stroke-width="4" />

    <!-- Línea de tendencia -->
    <path d="M22 55 L38 38 L48 48 L62 26" fill="none" stroke="url(#greenGrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />

    <!-- Puntos de los nodos -->
    <circle cx="62" cy="26" r="4.5" fill="#34D399" />
    <circle cx="22" cy="55" r="4.5" fill="#059669" />
  </g>

  <!-- Tipografía principal -->
  <text x="140" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="url(#textGrad)" letter-spacing="0.5">
    Cash<tspan fill="url(#greenGrad)">Tracker</tspan>
  </text>

  <!-- Subtítulo -->
  <text x="143" y="118" font-family="-apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#6B7280" letter-spacing="4.5">
    SMART EXPENSE MANAGEMENT
  </text>
</svg>
